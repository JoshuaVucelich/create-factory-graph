modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Server-side Create kinetic factory graph. Ship cadence defers decorative relays only; belts, deployers, and contraptions are not throttled and their debt is never replayed. safety.killSwitch and /factorygraph kill fail open. Mixin config is optional so a Create mismatch does not crash the server. Targets NeoForge 21.1.233, Create 6.0.10, Sable 2.0.3, Aeronautics 1.3.0.'''
# Server-side only: vanilla/Create clients without this mod can join.
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.228,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Mixins verified identical on Create 6.0.5–6.0.10 private fields/methods.
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.5,6.0.11)"
    ordering="AFTER"
    side="BOTH"
